[package]
name = "linkedin-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
httparse = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
rust-mcp-sdk = { version = "=1.1.0", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"
zeroize = { version = "1.8", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
rustix = { version = "1", features = ["fs", "process", "time"] }
